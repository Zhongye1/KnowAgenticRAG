networks:
  ragf_network:
    name: ragf_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.10.0/24


volumes:
  ragf_postgres:
    name: ragf_postgres
  ragf_redis:
    name: ragf_redis
  ragf_static:
    name: ragf_static
  ragf_static_upload:
    name: ragf_static_upload
  ragf_rabbitmq:
    name: ragf_rabbitmq
  ragf_loki_data:
    name: ragf_loki_data
  ragf_prometheus_data:
    name: ragf_prometheus_data
  ragf_tempo_data:
    name: ragf_tempo_data

services:
  # 后端API
  ragf_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ragf_server:latest
    ports:
      - "${DOCKER_MAP_SERVER_PORT:-8001}:8001"
    container_name: ragf_server
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      ragf_postgres:
        condition: service_healthy
      ragf_redis:
        condition: service_healthy
      ragf_rabbitmq:
        condition: service_healthy
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/ragf/backend/src/.env:ro
      - ragf_static:/ragf/backend/src/static
      - ragf_static_upload:/ragf/backend/src/static/upload
      - ${DOCKER_RAGF_SERVER_LOG:-./logs/ragf}:/var/log/ragf
    networks:
      - ragf_network

  ragf_postgres:
    image: postgres:16
    ports:
      - "${DOCKER_MAP_POSTGRES_PORT:-5432}:5432"
    container_name: ragf_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ragf_postgres:/var/lib/postgresql/data
    networks:
      - ragf_network

  ragf_redis:
    image: redis:latest
    ports:
      - "${DOCKER_MAP_REDIS_PORT:-6379}:6379"
    container_name: ragf_redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ragf_redis:/data
    networks:
      - ragf_network

  # 【后端专用】
  # 如果使用此容器，意味着你只需部署后端 API 服务，不需要前端
  # 这与下面的 ragf_ui 容器冲突，如果你选择使用 ragf_ui 容器，你应该注释或删除 ragf_nginx 容器脚本
  ragf_nginx:
    image: nginx:latest
    ports:
      - "${DOCKER_MAP_NGINX_PORT:-8000}:80"
    container_name: ragf_nginx
    restart: always
    depends_on:
      ragf_server:
        condition: service_started
    volumes:
      - ./deploy/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ragf_static:/www/ragf_server/backend/static:ro
      - ragf_static_upload:/www/ragf_server/backend/static/upload:ro
    networks:
      - ragf_network

  #  # 如果服务器内存小于 4GB，CPU 小于四个内核
  #  # 建议通过前端工程单独构建此容器或在本地进行构建
  #  ragf_ui:
  #    build:
  #      context: /root/fastapi_best_architecture_ui
  #      dockerfile: Dockerfile
  #    image: ragf_ui:latest
  #    ports:
  #      - "80:80"
  #      - "443:443"
  #    container_name: ragf_ui
  #    restart: always
  #    depends_on:
  #      - ragf_server
  #    command:
  #      - nginx
  #      - -g
  #      - daemon off;
  #    volumes:
  #      # nginx https conf
  #      # 通过 docker 进行部署时，需要打开此配置项并确保<挂载到容器内的证书文件路径>配置
  #      # 与 nginx conf 中的 ssl 证书文件路径配置一致，如果你直接将 ssl 证书文件 cp
  #      # 到了 docker 容器内，则无需挂载证书文件，直接将它们注释或删除即可
  #      # local_ssl_pem_path：你在服务器存放 ssl pem 证书文件的路径，自行修改
  #      # local_ssl_key_path: 你在服务器存放 ssl key 证书文件的路径，自行修改
  #      # /etc/ssl/xxx.pem：挂载到容器内 ssl pem 证书文件的路径，自行修改
  #      # /etc/ssl/xxx.key：挂载到容器内 ssl key 证书文件的路径，自行修改
  #      - local_ssl_pem_path:/etc/ssl/xxx.pem
  #      - local_ssl_key_path:/etc/ssl/xxx.key
  #      - ragf_static:/www/ragf_server/backend/static
  #      - ragf_static_upload:/www/ragf_server/backend/static/upload
  #    networks:
  #      - ragf_network

  ragf_rabbitmq:
    hostname: ragf_rabbitmq
    image: rabbitmq:3.13.7-management
    ports:
      - "${DOCKER_MAP_RABBITMQ_UI_PORT:-15672}:15672"
      - "${DOCKER_MAP_RABBITMQ_PORT:-5672}:5672"
    container_name: ragf_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - ragf_rabbitmq:/var/lib/rabbitmq
    networks:
      - ragf_network

  ragf_celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=ragf_celery_worker
    image: ragf_celery_worker:latest
    # 如果你需要分布式部署 Worker，则必须移除此 container_name 配置
    container_name: ragf_celery_worker
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      ragf_rabbitmq:
        condition: service_healthy
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/ragf/backend/src/.env:ro
      - ${DOCKER_RAGF_SERVER_LOG:-./logs/ragf}:/var/log/ragf
    networks:
      - ragf_network

  ragf_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=ragf_celery_beat
    image: ragf_celery_beat:latest
    container_name: ragf_celery_beat
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      ragf_rabbitmq:
        condition: service_healthy
      ragf_celery_worker:
        condition: service_started
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/ragf/backend/src/.env:ro
      - ${DOCKER_RAGF_SERVER_LOG:-./logs/ragf}:/var/log/ragf
    networks:
      - ragf_network

  ragf_celery_flower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=ragf_celery_flower
    image: ragf_celery_flower:latest
    ports:
      - "${DOCKER_MAP_CELERY_FLOWER_PORT:-8555}:8555"
    container_name: ragf_celery_flower
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      ragf_rabbitmq:
        condition: service_healthy
      ragf_celery_worker:
        condition: service_started
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/ragf/backend/src/.env:ro
      - ${DOCKER_RAGF_SERVER_LOG:-./logs/ragf}:/var/log/ragf
    networks:
      - ragf_network

  ragf_celery_exporter:
    image: danihodovic/celery-exporter:latest
    restart: always
    ports:
      - "${DOCKER_MAP_CELERY_EXPORTER_PORT:-9808}:9808"
    container_name: ragf_celery_exporter
    environment:
      - CE_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@ragf_rabbitmq:5672//
    depends_on:
      ragf_rabbitmq:
        condition: service_healthy
    networks:
      - ragf_network

