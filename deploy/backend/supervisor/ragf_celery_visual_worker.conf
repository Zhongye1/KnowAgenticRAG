[program:ragf_celery_visual_worker]
directory=/ragf
; 并发=1（双管线摄取 spec D4：视觉编码/渲染为重资源，串行消费）
command=/usr/local/bin/celery -A backend.src.app.task.celery:celery_app worker -P gevent -c 1 -Q visual --loglevel=INFO
user=root
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/ragf/ragf_celery_visual_worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
