[program:ragf_celery_beat]
directory=/ragf
command=/usr/local/bin/celery -A backend.src.app.task.celery:celery_app beat --loglevel=INFO
user=root
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/ragf/ragf_celery_beat.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
