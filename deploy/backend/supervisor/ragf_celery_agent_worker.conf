[program:ragf_celery_agent_worker]
directory=/ragf
; -Q agent（agent 层设计 D66）：Run 是分钟级长任务且持有数据库租约，与摄取/转换
; 挤在同一个队列里会互相拖慢。并发给 32 而不是 1000——每个 Run 都要占模型连接与
; 检索通道，堆太多并发只会把下游打满，反而拖长每个 Run 的墙钟。
command=/usr/local/bin/celery -A backend.src.app.task.celery:celery_app worker -P gevent -c 32 -Q agent --loglevel=INFO
user=root
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/ragf/ragf_celery_agent_worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
