[program:ragf_celery_flower]
directory=/ragf
command=/usr/local/bin/celery -A backend.src.app.task.celery:celery_app flower --port=8555 --url-prefix=flower --basic-auth=admin:123456 --loglevel=INFO
user=root
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/ragf/ragf_celery_flower.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
