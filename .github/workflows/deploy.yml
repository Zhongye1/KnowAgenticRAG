# 构建 Rspress 站点并将其部署到 GitHub Pages
#
name: Deploy Rspress site to Pages

on:
  # 在 docs 相关变更推送时运行构建（任意分支）
  # 首页的皮肤与截图由 docs 站直接引用 web 下的同一份文件（见
  # docs/develop-guides/decisions/implemented/2026-10-16-docs-home-page.md），
  # 因此这三条 web 路径的改动也要触发重建。
  push:
    paths:
      - 'docs/**'
      - 'web/src/styles/home.css'
      - 'web/src/styles/home-tokens.css'
      - 'web/public/assets/home/**'
      - '.github/workflows/deploy.yml'

  # 在面向默认分支（master）的 PR 中提前验证 docs 构建
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'web/src/styles/home.css'
      - 'web/src/styles/home-tokens.css'
      - 'web/public/assets/home/**'
      - '.github/workflows/deploy.yml'

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # 必须显式给版本：仓库根没有 package.json（pnpm 项目在 docs/），action 默认读根的
      # package.json 拿不到 packageManager，会直接以 "No pnpm version is specified" 失败。
      # 取值与 docs/package.json 的 packageManager、dependency-audit.yml 保持一致。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build with Rspress
        run: pnpm build
        working-directory: docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/doc_build

  # 部署工作
  deploy:
    # 默认分支是 master：写成 main 时部署任务不会执行，线上一直停在上一次成功部署的旧产物
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
