[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhongye", email = "2760913192@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "asyncio>=4.0.0",
    "bcrypt>=5.0.0",
    "cachebox>=6.2.5",
    "celery>=5.6.3",
    "celery-aio-pool>=0.1.0rc8",
    "cryptography>=50.0.0",
    "dulwich>=1.2.12",
    "fast-captcha>=0.3.2",
    "fastapi-oauth20>=0.0.3",
    "fastapi-pagination>=0.15.16",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "msgspec>=0.21.1",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-asyncio>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-openai>=0.62.3",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "pwdlib>=0.3.1",
    "py-ip2region>=3.0.4",
    "pyrate-limiter>=4.4.0",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "rtoml>=0.13.0",
    "ruff>=0.16.3",
    "socketio>=0.2.1",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-crud-plus>=1.13.3",
    "sqlparse>=0.6.0",
    "starlette-context>=0.5.1",
    "user-agents>=2.2.0",
]

[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "task>=0.1.0",
]
