default_language_version:
  python: '>= 3.10'

# 上游同步来的技能目录（.agents/，见 skills-lock.json）不是本项目代码：
# 不参与任何钩子（格式化/JSON/YAML/TOML 校验/ruff），避免被本地规则改写。
exclude: ^\.agents/

# 前端（frontend/）本期冻结，不在任何钩子范围内；其门禁在前端阶段另行立项。
# 架构契约钩子（import-linter / dependency-cruiser）随 fba 后端与 React 前端一并移除，
# 后端分层契约改由 scripts/verify_engineering_contracts.py 承担。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args:
          # https://github.com/charliermarsh/ruff-pre-commit/issues/64
          - '--fix'
      - id: ruff-format

  # 依赖锁一致性：pyproject.toml 与 uv.lock 必须同步，
  # 否则 api 镜像的 `uv sync --frozen` 会直接失败。
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  # 工程契约校验（上游 scripts/verify_engineering_contracts.py）：
  # 语义 Owner、证据、决策记录与派生审计的静态检查。
  # 依赖 uv 环境，故用 local + system language。
  - repo: local
    hooks:
      - id: engineering-contracts
        name: 'contracts: verify_engineering_contracts（工程契约静态校验）'
        entry: python3 scripts/verify_engineering_contracts.py
        language: system
        pass_filenames: false
        always_run: true
