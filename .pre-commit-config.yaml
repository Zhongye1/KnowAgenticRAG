default_language_version:
  python: '>= 3.10'

# 上游同步来的技能目录（.agents/，见 skills-lock.json）不是本项目代码：
# 不参与任何钩子（格式化/JSON/YAML/TOML 校验/ruff），避免被本地规则改写。
exclude: ^\.agents/

# 前端门禁由 web/ 自己拥有：lint / 单测 / 设计 token / 分层 / 契约漂移。
# 这些钩子只在改动命中 web/ 时运行，避免无关提交被 Node 工具链拖慢。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args:
          # https://github.com/charliermarsh/ruff-pre-commit/issues/64
          - '--fix'
      - id: ruff-format

  # 依赖锁一致性：pyproject.toml 与 uv.lock 必须同步，
  # 否则 api 镜像的 `uv sync --frozen` 会直接失败。
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  # 工程契约校验（上游 scripts/verify_engineering_contracts.py）：
  # 语义 Owner、证据、决策记录与派生审计的静态检查。
  # 依赖 uv 环境，故用 local + system language。
  - repo: local
    hooks:
      - id: engineering-contracts
        name: 'contracts: verify_engineering_contracts（工程契约静态校验）'
        entry: python3 scripts/verify_engineering_contracts.py
        language: system
        pass_filenames: false
        always_run: true

      # web/ 的只读门禁。`lint` 与 `format` 允许本地自动修复，钩子里只用只读形态。
      - id: web-lint
        name: 'web: oxlint（只读）'
        entry: bash -c 'cd web && pnpm run lint:check'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false

      - id: web-types
        name: 'web: tsc 类型检查'
        entry: bash -c 'cd web && pnpm run check-types'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false

      - id: web-tokens
        name: 'web: 设计 Token 校验'
        entry: bash -c 'cd web && pnpm run check:tokens'
        language: system
        files: ^web/src/.*\.(ts|tsx|css)$
        pass_filenames: false

      - id: web-fsd
        name: 'web: Steiger FSD 结构校验'
        entry: bash -c 'cd web && pnpm run lint:fsd'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: web-arch
        name: 'web: dependency-cruiser 分层校验'
        entry: bash -c 'cd web && pnpm run arch:check'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
