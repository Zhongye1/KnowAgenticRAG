version: '3'

# 项目统一任务入口。执行的事实来源是 docker compose 与各工具的原始命令。
#
# 开发拓扑为全容器化（docker compose）：api / worker / storage-migrator /
# sandbox-provisioner / postgres / redis / minio / milvus / etcd / graph。
# 前端（frontend/）本期冻结，不在任何任务范围内——上游 Makefile 中的
# web/pnpm 目标已随之移除。

vars:
  BACKEND_PYTHON:
    sh: cat backend/.python-version
  # 宿主 shell 可能残留旧项目的同名导出；docker compose 的变量优先级是
  # shell 环境 > .env，残留值会静默覆盖 .env 与 compose 默认值
  # （实测 POSTGRES_DB 曾把数据库建成旧名，且 /api/system/ready 仍返回 200）。
  CLEAN_ENV: 'unset POSTGRES_DB POSTGRES_USER;'

tasks:
  default:
    desc: 列出全部任务
    silent: true
    cmds:
      - task --list

  # ==================== 生命周期 ====================
  up:
    desc: 拉起全栈（docker compose up -d）
    preconditions:
      - sh: test -f .env
        msg: '缺少 .env：请先 cp .env.template .env，并填写必需项（见模板注释）。'
    cmds:
      - sh -c '{{.CLEAN_ENV}} docker compose up -d'

  up-lite:
    desc: LITE 模式起最小栈（不注册知识库/图谱/评估）
    preconditions:
      - sh: test -f .env
        msg: '缺少 .env：请先 cp .env.template .env，并填写必需项（见模板注释）。'
    cmds:
      - sh -c '{{.CLEAN_ENV}} LITE_MODE=true docker compose up -d postgres redis minio api worker'

  down:
    desc: 停止全栈
    cmds:
      - sh -c '{{.CLEAN_ENV}} docker compose down'

  reset:
    desc: 停止、删除数据卷、重启并写入种子（破坏性）
    preconditions:
      - sh: test -f .env
        msg: '缺少 .env：请先 cp .env.template .env，并填写必需项（见模板注释）。'
    cmds:
      - sh -c '{{.CLEAN_ENV}} docker compose down'
      - rm -rf docker/volumes
      - sh -c '{{.CLEAN_ENV}} docker compose up -d'
      - sh -c 'until docker compose exec -T api true >/dev/null 2>&1; do sleep 2; done'
      - task: seed

  logs:
    desc: 查看 api 日志与当前分支/提交
    cmds:
      - docker logs --tail=50 api-dev
      - |
        echo
        echo "Branch:    $(git branch --show-current)"
        echo "Commit ID: $(git rev-parse HEAD)"
        echo "System:    $(uname -a)"

  seed:
    desc: 写入初始用户
    # --no-sync：容器以 uid 1000 运行而 site-packages 为 root 属主，
    # 不带此参数会因重建 editable 安装而 Permission denied。
    cmds:
      - docker compose exec -T api uv run --no-sync python scripts/seed_initial_users.py

  ps:
    desc: 查看服务状态
    cmds:
      - sh -c '{{.CLEAN_ENV}} docker compose ps'

  shell:
    desc: 进入 api 容器
    cmds:
      - docker compose exec api bash

  # ==================== 质量门禁 ====================
  lint:
    desc: 只检查不修改（ruff check + import 排序），供提交前与 CI 使用
    cmds:
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run ruff check package
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run ruff check --select I package
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run ruff format package --diff

  format:
    desc: 格式化（ruff format + ruff check --fix + import 排序修复）
    cmds:
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run ruff format package
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run ruff check package --fix
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run ruff check --select I package --fix

  test:
    desc: 后端单元测试（不依赖容器服务）
    cmds:
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run pytest test/unit -m "not slow" {{.PYTEST_ARGS}}

  test:integration:
    desc: 后端集成测试（真实 PostgreSQL / 真实 HTTP，需容器内环境）
    cmds:
      - docker compose exec -T api uv run --no-sync --group test pytest test/integration

  test:e2e:
    desc: 后端端到端测试（需容器内环境）
    cmds:
      - docker compose exec -T api uv run --no-sync --group test pytest test/e2e -m e2e

  verify:
    desc: 工程契约校验（verify_engineering_contracts + 其自测）
    cmds:
      - python3 scripts/verify_engineering_contracts.py
      - python3 -m unittest scripts.test_verify_engineering_contracts

  # ==================== 依赖审计 ====================
  audit-dependencies:
    desc: 依赖供应链审计（含负向 fixture，验证 gate 的失败路径）
    cmds:
      - cd backend && uv audit --locked --no-dev --ignore GHSA-h35f-9h28-mq5c --ignore GHSA-rrmf-rvhw-rf47
      - cd packages/ars-cli && uv audit --locked --no-dev
      - cd docs && pnpm audit --audit-level=high --prod
      - |
        if uv audit --script scripts/dependency-audit-fixtures/vulnerable.py > /tmp/ars-python-audit-negative.log 2>&1; then
          echo "Expected the vulnerable Python fixture to fail"; exit 1
        fi
        grep -q "aiohttp 3.14.1 has" /tmp/ars-python-audit-negative.log
        grep -q "GHSA-cq5v-8q36-5273" /tmp/ars-python-audit-negative.log
      - |
        if cd scripts/dependency-audit-fixtures/node && pnpm audit --audit-level=high --prod > /tmp/ars-node-audit-negative.log 2>&1; then
          echo "Expected the vulnerable Node.js fixture to fail"; exit 1
        fi
        grep -q "js-yaml" /tmp/ars-node-audit-negative.log
        grep -q "GHSA-5p4m-2wfm-xmqj" /tmp/ars-node-audit-negative.log

  audit-licenses:
    desc: 依赖许可证清单
    cmds:
      - cd backend && UV_PYTHON={{.BACKEND_PYTHON}} uv run --isolated --no-dev --with pip-licenses pip-licenses --from mixed --format markdown
      - cd packages/ars-cli && uv run --isolated --no-dev --with pip-licenses pip-licenses --from mixed --format markdown

  # ==================== 前端（web/） ====================
  # 容器内开发是默认路径（R3 全面容器化）；容器未起时可在 web/ 下直接 pnpm run dev。
  web:install:
    desc: 容器内安装前端依赖
    cmds:
      - docker compose exec -T web pnpm install --frozen-lockfile

  web:dev:
    desc: 查看前端开发服务器状态（服务由 docker compose 托管）
    cmds:
      - sh -c '{{.CLEAN_ENV}} docker compose up -d web && docker compose ps web'

  web:logs:
    desc: 前端开发服务器日志
    cmds:
      - docker compose logs -f web

  web:lint:
    desc: 前端 lint（只读）
    cmds:
      - docker compose exec -T web pnpm run lint:check

  web:test:
    desc: 前端单元测试
    cmds:
      - docker compose exec -T web pnpm run test:unit

  web:build:
    desc: 前端生产构建
    cmds:
      - docker compose exec -T web pnpm run build

  web:verify:
    desc: 前端全部门禁（lint / 单测 / 设计 token / 分层 / 契约漂移 / 构建）
    cmds:
      - docker compose exec -T web pnpm run lint:check
      - docker compose exec -T web pnpm run test:unit
      - docker compose exec -T web pnpm run check:tokens
      - docker compose exec -T web pnpm run arch:check
      - docker compose exec -T web pnpm run lint:fsd
      - docker compose exec -T web pnpm run api:check
      - docker compose exec -T web pnpm run build

  web:api:
    desc: 刷新契约快照并重新生成客户端（后端改动后执行）
    cmds:
      - docker compose exec -T web pnpm run api:snapshot
      - docker compose exec -T web pnpm run api:gen
