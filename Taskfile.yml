version: '3'

# 项目统一入口 Taskfile
# 通过 includes 聚合前后端各自独立的子 Taskfile：
# - backend/Taskfile.yml  后端任务
# - frontend/Taskfile.yml 前端任务

includes:
  backend:
    taskfile: backend/Taskfile.yml
    dir: backend
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

vars:
  # Docker 依赖服务（本地开发：依赖跑容器，代码跑宿主机）
  DEPS_SERVICES: ragf_postgres ragf_redis ragf_rabbitmq ragf_minio ragf_milvus
  # Knowhere 自托管解析栈（独立 compose 项目：app + 专用 postgres/redis/localstack，
  # 见 docker/knowhere/compose.yaml；解析凭据在 docker/knowhere/.env 配置）
  KNOWHERE_DIR: ./docker/knowhere
  # 文档预览转换栈（独立 compose 项目：LibreOffice headless 转换服务，见
  # docker/libreoffice/compose.yaml；加固参数在 compose 内，可选覆盖见其 .env.example）
  LIBREOFFICE_DIR: ./docker/libreoffice

tasks:
  dev:
    desc: 启动本地开发环境（Docker 依赖 + Knowhere 解析栈 + 宿主机代码）
    cmds:
      - task: deps-up
      - task: backend:dev
      - task: frontend:dev

  dev:stop:
    desc: 停止本地开发环境（结束前后端进程 + 停止 Docker 依赖）
    cmds:
      - sh -c 'pkill -f "[u]vicorn backend.main:app" 2>/dev/null && echo "后端已停止" || echo "后端未在运行"'
      - sh -c 'pkill -f "[v]ite" 2>/dev/null && echo "前端已停止" || echo "前端未在运行"'
      - task: deps-down

  deps-up:
    desc: 启动 Docker 依赖并等待健康（PostgreSQL / Redis / RabbitMQ / MinIO / Milvus + Knowhere）
    cmds:
      - sh -c '[ -f .env ] || { echo "缺少根 .env，请先创建：cp .env.example .env（填写 POSTGRES_*/RABBITMQ_* 等）"; exit 1; }'
      - docker compose up -d --wait {{.DEPS_SERVICES}}
      - task: knowhere:up
      - task: libreoffice:up

  deps-down:
    desc: 停止 Docker 依赖
    cmds:
      - docker compose stop {{.DEPS_SERVICES}}
      - task: knowhere:stop
      - task: libreoffice:stop

  deps-status:
    desc: 查看 Docker 依赖运行状态
    cmds:
      - docker compose ps {{.DEPS_SERVICES}}
      - task: knowhere:ps
      - task: libreoffice:ps

  deps-logs:
    desc: 跟踪 Docker 依赖日志（Knowhere 栈日志另用 task knowhere:logs）
    cmds:
      - docker compose logs -f --tail=100 {{.DEPS_SERVICES}}

  # ==================== Knowhere 自托管解析栈（独立 compose 项目） ====================
  # app（ghcr.io/ontos-ai/knowhere，API :5005 / 控制台 :13000）+ 专用 postgres/redis/localstack；
  # 经外部共享网络 knowhere-net 以 DNS 名 knowhere 暴露。宿主机代码直接用 localhost:5005。
  knowhere:net:
    desc: 确保共享外部网络 knowhere-net 存在（ragf 容器经 DNS 名 knowhere 访问）
    cmds:
      - docker network create knowhere-net 2>/dev/null || true

  knowhere:up:
    desc: 拉起 Knowhere 解析栈（首次拉镜像较慢；--wait 超时仅告警不阻塞）
    dir: '{{.KNOWHERE_DIR}}'
    deps: [knowhere:net]
    cmds:
      # unset 防 shell 残留环境变量覆盖栈自身 env.defaults（如 POSTGRES_PASSWORD）
      - sh -c 'unset POSTGRES_PASSWORD APP_ENV; docker compose up -d --wait --wait-timeout 240 || echo "⚠️ Knowhere 栈尚未健康（首次拉镜像/预热较慢），就绪前摄取 fail-closed；task knowhere:ps 查看"'

  knowhere:stop:
    desc: 停止 Knowhere 解析栈（保留容器与数据卷，重启更快）
    dir: '{{.KNOWHERE_DIR}}'
    cmds:
      - sh -c 'unset POSTGRES_PASSWORD APP_ENV; docker compose stop'

  knowhere:down:
    desc: 移除 Knowhere 解析栈容器（保留数据卷：模型缓存/库数据）
    dir: '{{.KNOWHERE_DIR}}'
    cmds:
      - sh -c 'unset POSTGRES_PASSWORD APP_ENV; docker compose down'

  knowhere:ps:
    desc: 查看 Knowhere 解析栈状态
    dir: '{{.KNOWHERE_DIR}}'
    cmds:
      - sh -c 'unset POSTGRES_PASSWORD APP_ENV; docker compose ps'

  knowhere:logs:
    desc: 跟踪 Knowhere 解析栈日志
    dir: '{{.KNOWHERE_DIR}}'
    cmds:
      - sh -c 'unset POSTGRES_PASSWORD APP_ENV; docker compose logs -f --tail=100'

  # ==================== 文档预览转换栈（独立 compose 项目，D55） ====================
  # LibreOffice headless 转换服务（:5030）：Office → 线性化 PDF。
  # 加固（非 root / rootfs 只读 / cap_drop ALL / tmpfs / 资源上限）见 compose 内注释；
  # 网络级出网封锁未做，原因与替代方案同样记在该文件头部。
  libreoffice:up:
    desc: 拉起预览转换服务（首次构建镜像较慢）
    dir: '{{.LIBREOFFICE_DIR}}'
    cmds:
      - sh -c 'docker compose up -d --build --wait --wait-timeout 240 || echo "⚠️ 转换服务尚未健康，Office 预览会走降级梯（解析产物 Markdown）；task libreoffice:ps 查看"'

  libreoffice:stop:
    desc: 停止预览转换服务（保留镜像，重启更快）
    dir: '{{.LIBREOFFICE_DIR}}'
    cmds:
      - docker compose stop

  libreoffice:down:
    desc: 移除预览转换服务容器
    dir: '{{.LIBREOFFICE_DIR}}'
    cmds:
      - docker compose down

  libreoffice:ps:
    desc: 查看预览转换服务状态
    dir: '{{.LIBREOFFICE_DIR}}'
    cmds:
      - docker compose ps

  libreoffice:logs:
    desc: 跟踪预览转换服务日志
    dir: '{{.LIBREOFFICE_DIR}}'
    cmds:
      - docker compose logs -f --tail=100

  worker:
    desc: 启动 Celery Worker（消息队列消费者）
    cmds:
      - task: backend:worker

  worker:test:
    desc: 启动指向测试库的 Celery Worker（接口 e2e chain 用例专用）
    cmds:
      - task: backend:worker:test

  beat:
    desc: 启动 Celery Beat（定时任务调度器）
    cmds:
      - task: backend:beat

  db-init:
    desc: 导入数据库初始化数据（可选）
    cmds:
      - task: backend:db-init

  init:
    desc: 一键初始化项目（安装依赖 → 启动依赖 → 建表 → 种子数据）
    cmds:
      - task: install
      - task: deps-up
      - task: backend:init-db
      - task: db-init
      - task: deps-status
      - echo '初始化完成。启动项目：task dev；异步任务另开终端：task worker'

  build:
    desc: 构建后端 Python 安装包（wheel + sdist）
    cmds:
      - task: backend:build

  docker-build:
    desc: 构建 Docker 镜像（默认 ragf_server 与全部 Celery 服务）
    cmds:
      - sh -c '[ -f .env ] || { echo "缺少根 .env，请先创建：cp .env.example .env（填写 POSTGRES_*/RABBITMQ_* 等）"; exit 1; }'
      - docker compose build {{.DOCKER_SERVICES | default "ragf_server ragf_celery_worker ragf_celery_beat ragf_celery_flower"}}

  env:check:
    desc: 校验各层 env 账号字段一致性
    cmds:
      - backend/.venv/bin/python backend/scripts/env_check.py

  install:
    desc: 安装全部依赖（后端 + 前端）
    cmds:
      - task: backend:install
      - task: frontend:install

  lint:
    desc: 代码检查（后端 + 前端）
    cmds:
      - task: backend:lint
      - task: frontend:lint

  format:
    desc: 格式化代码（后端 + 前端）
    cmds:
      - task: backend:format
      - task: frontend:format

  test:
    desc: 运行测试（后端 + 前端）
    cmds:
      - task: backend:test
      - task: frontend:test
